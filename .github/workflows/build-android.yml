# GitHub Actions: Android APK 构建（FFmpeg DSP 纯本地引擎，无 ONNX 依赖）
#
# 说明：
#   - ffmpeg-kit-react-native 已替换为内置预编译 AAR 的 richkuo7 版本（vendor/），
#     无需从 Maven Central 拉取已下架的 com.arthenica artifact。
#   - ONNX Runtime 已彻底移除（鸿蒙 4.2 Android 兼容层下 TurboModule JNI 加载 SIGABRT）。
#   - 母带增强改为纯 FFmpeg DSP 滤镜链（acompressor/alimiter/loudnorm/equalizer），
#     完全规避 .so 兼容性问题，所有 Android/HarmonyOS 设备均可运行。
#   - 构建流程：pnpm install → expo prebuild → gradle assembleRelease → 上传 APK。
#   - APK 同时上传至 Supabase Storage，生成国内可直连的下载 CDN 链接。
#   - 使用 debug keystore 签名（仅用于内部测试）。

name: Build Android APK

on:
  # 手动触发
  workflow_dispatch:
  # push 到 master 分支时自动触发
  push:
    branches: [master]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # 允许创建 GitHub Release 和上传 APK 附件

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 获取 pnpm 缓存目录
        id: pnpm-cache-dir
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 设置 Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 设置 Android SDK（含 NDK 27 和 CMake）
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: Lint 校验
        run: npm run lint

      - name: Expo prebuild（生成 Android 原生工程）
        run: npx expo prebuild --platform android --no-install --clean

      - name: 修复 onnxruntime VersionNumber 兼容性（已移除 ONNX，保留空步骤确保历史日志不断）
        run: echo "ONNX Runtime 已完全移除，跳过补丁步骤"

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 构建 Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: audio-converter-pro-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # ── 自动创建 GitHub Release（公开下载）────────────────────────────────
      - name: 读取版本号
        id: get_version
        run: |
          VERSION=$(node -e "const a=require('./app.json'); console.log(a.expo.version)")
          BUILD=${{ github.run_number }}
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${BUILD}" >> $GITHUB_OUTPUT
          echo "apk_filename=audio-pro-v${VERSION}-build${BUILD}.apk" >> $GITHUB_OUTPUT

      # ── 上传 APK 到 Supabase Storage（国内直连 CDN 下载链接）──────────────
      - name: 上传 APK 至 Supabase Storage
        id: supabase_upload
        run: |
          SUPABASE_URL="https://backend.appmiaoda.com/projects/supabase344135131251916800"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiZXhwIjoyMTAxNDc1NDA5LCJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwic3ViIjoiYW5vbiJ9.KbTEzW4JlJKj_rxOjex6xdo-p-5CJOahmKY6is1S89c"
          FILENAME="${{ steps.get_version.outputs.apk_filename }}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          # upsert 上传（x-upsert:true 覆盖同名文件）
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/apk-releases/${FILENAME}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary @"${APK_PATH}")

          DIRECT_URL="${SUPABASE_URL}/storage/v1/object/public/apk-releases/${FILENAME}"
          echo "http_status=${HTTP_STATUS}" >> $GITHUB_OUTPUT
          echo "direct_url=${DIRECT_URL}" >> $GITHUB_OUTPUT
          echo "📦 APK 直链: ${DIRECT_URL}"
          echo "📊 HTTP 状态: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️ 上传返回 ${HTTP_STATUS}，请检查 Supabase 存储桶权限"
          fi

      - name: 创建 GitHub Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Release ${{ steps.get_version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            ## 📱 AI 音乐音频处理 Pro — ${{ steps.get_version.outputs.version }}

            ### 🔧 本次更新
            - **彻底移除 ONNX Runtime**：已确认鸿蒙 4.2 Android 兼容层下 TurboModule JNI 加载触发 SIGABRT 崩溃（无法 try-catch 拦截），根因为 `libonnxruntime.so` 在 HarmonyOS 兼容层的 linker 行为异常。
            - **FFmpeg DSP 替代方案**：母带级增强改为纯 FFmpeg 滤镜链（EQ/acompressor/alimiter/loudnorm），无需任何模型文件，100% 本地运算，全平台兼容。
            - 简单模式：降噪级 DSP（高通+多段EQ+压缩+限幅+EBU R128 -14 LUFS）
            - 困难模式：DSP Pro（宽带提升+强压缩+精密限幅+严格响度）
            - 版本号：**${{ steps.get_version.outputs.version }}** · 构建号：**${{ github.run_number }}**

            ### 📥 下载地址（国内直连，无需翻墙）
            > **直链下载（Supabase CDN）：**
            > ${{ steps.supabase_upload.outputs.direct_url }}

            ### 🔗 备用下载
            下载附件中的 `${{ steps.get_version.outputs.apk_filename }}` 安装（需开启「允许未知来源」）。

            Commit: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
